<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종합 생활 금융 계산기 모음 (전월세·연말정산·주휴수당 등)</title>
    <meta name="description" content="전월세 전환율, 연말정산, 주휴수당, 세전세후 월급, 퇴직금, 실업급여, 만나이까지 한 번에 계산하는 종합 금융 유틸리티 도구입니다.">
    
    <meta name="google-site-verification" content="gE0-HD8J53xztoLRmmDCBo4ccLlpgUjSN2aQw7z8jKM" />
    <meta name="naver-site-verification" content="64ed0e5eae936859bc0da6cdb51688f76c54bb01" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4802312161852466" crossorigin="anonymous"></script>

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 620px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        h1 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 4px;
            color: #0f172a;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 18px;
        }
        .tab-menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 22px;
        }
        .tab-btn {
            padding: 9px 4px;
            background: #e2e8f0;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            color: #475569;
            transition: all 0.2s;
            text-align: center;
        }
        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }
        .calculator-content {
            display: none;
        }
        .calculator-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 13px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            background: #fff;
        }
        input:focus, select:focus {
            border-color: var(--primary-color);
        }
        .calc-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 6px;
        }
        .calc-btn:hover {
            background-color: var(--primary-hover);
        }
        .result-box {
            margin-top: 18px;
            background: #f1f5f9;
            padding: 16px;
            border-radius: 12px;
            display: none;
        }
        .result-box h3 {
            font-size: 14px;
            margin-bottom: 8px;
            color: #1e293b;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .result-value {
            font-weight: bold;
            color: var(--primary-color);
        }
        .highlight {
            color: #dc2626;
        }
        .korean-unit {
            font-size: 12px;
            color: #64748b;
            text-align: right;
            margin-top: 2px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>종합 생활 금융 계산기</h1>
    <p class="subtitle">필요한 생활 금융 계산을 한곳에서 간편하게 이용하세요</p>

    <!-- 탭 메뉴 (7개) -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab(1)">전월세 전환율</button>
        <button class="tab-btn" onclick="switchTab(2)">연말정산</button>
        <button class="tab-btn" onclick="switchTab(3)">주휴수당·알바</button>
        <button class="tab-btn" onclick="switchTab(4)">세전·세후월급</button>
        <button class="tab-btn" onclick="switchTab(5)">퇴직금 계산</button>
        <button class="tab-btn" onclick="switchTab(6)">실업급여 계산</button>
        <button class="tab-btn" onclick="switchTab(7)" style="grid-column: span 3;">만나이·디데이</button>
    </div>

    <!-- 1번: 전월세 전환율 계산기 -->
    <div id="calc1" class="calculator-content active">
        <div class="form-group"><label for="jeonseDeposit">기존 전세 보증금 (원)</label><input type="text" id="jeonseDeposit" value="300,000,000" oninput="formatInputNumber(this, 'jeonseUnit')"></div>
        <div class="korean-unit" id="jeonseUnit">3억 원</div>
        <div class="form-group"><label for="monthlyDeposit">변경할 보증금 (원)</label><input type="text" id="monthlyDeposit" value="200,000,000" oninput="formatInputNumber(this, 'monthlyDepUnit')"></div>
        <div class="korean-unit" id="monthlyDepUnit">2억 원</div>
        <div class="form-group"><label for="interestRate">전월세 전환율 (%)</label><input type="number" id="interestRate" step="0.1" value="5.5"></div>
        <button class="calc-btn" onclick="calcRent()">월세 계산하기</button>
        <div class="result-box" id="resultBox1">
            <h3>전월세 전환 계산 결과</h3>
            <div class="result-item"><span>보증금 차액:</span><span class="result-value" id="resDiffDeposit">0 원</span></div>
            <div class="result-item"><span>예상 월세 (월):</span><span class="result-value highlight" id="resMonthlyRent">0 원</span></div>
        </div>
    </div>

    <!-- 2번: 연말정산 -->
    <div id="calc2" class="calculator-content">
        <div class="form-group"><label for="salary">연간 총급여액 (원)</label><input type="text" id="salary" value="40,000,000" oninput="formatInputNumber(this, 'salaryUnit')"></div>
        <div class="korean-unit" id="salaryUnit">4,000만 원</div>
        <div class="form-group"><label for="cardSpent">신용·체크카드 총 사용액 (원)</label><input type="text" id="cardSpent" value="15,000,000" oninput="formatInputNumber(this, 'cardUnit')"></div>
        <div class="korean-unit" id="cardUnit">1,500만 원</div>
        <button class="calc-btn" onclick="calcTax()">예상 환급금 계산하기</button>
        <div class="result-box" id="resultBox2">
            <h3>연말정산 간이 계산 결과</h3>
            <div class="result-item"><span>소득공제 예상액:</span><span class="result-value" id="resDeduction">0 원</span></div>
            <div class="result-item"><span>예상 환급액:</span><span class="result-value highlight" id="resRefund">0 원</span></div>
        </div>
    </div>

    <!-- 3번: 주휴수당 -->
    <div id="calc3" class="calculator-content">
        <div class="form-group"><label for="hourlyWage">시급 (원)</label><input type="text" id="hourlyWage" value="10,030" oninput="formatInputNumber(this, 'wageUnit')"></div>
        <div class="korean-unit" id="wageUnit">1만 30 원</div>
        <div class="form-group"><label for="weeklyHours">일주일 총 근로시간 (시간)</label><input type="number" id="weeklyHours" value="40"></div>
        <button class="calc-btn" onclick="calcSalary()">주휴수당 포함 월급 계산하기</button>
        <div class="result-box" id="resultBox3">
            <h3>알바·급여 계산 결과</h3>
            <div class="result-item"><span>주휴수당 여부:</span><span class="result-value" id="resHolidayPay
